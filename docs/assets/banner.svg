    <g font-family="'Be Vietnam Pro','Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#FFFFFF">
      <text x="72" y="142" font-size="68" font-weight="700">Quản lý nhà trọ</text>
      <text x="74" y="192" font-size="26" opacity="0.92">Điện nước, hóa đơn, thu tiền, đối chiếu</text>
      <text x="74" y="228" font-size="26" opacity="0.92">gọn trong một hệ thống</text>
