<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Quản lý nhà trọ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A9078"/>
      <stop offset="0.55" stop-color="#1F6F5C"/>
      <stop offset="1" stop-color="#0F3D33"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="24"/>
