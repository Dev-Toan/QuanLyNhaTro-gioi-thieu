    <circle cx="1090" cy="30" r="190" fill="#FFFFFF" opacity="0.06"/>
    <circle cx="820" cy="340" r="150" fill="#FFFFFF" opacity="0.05"/>

    <g transform="translate(800 92)">
      <rect x="0" y="0" width="330" height="228" rx="12" fill="#FFFFFF" opacity="0.12"/>
      <rect x="-14" y="-14" width="358" height="20" rx="8" fill="#FFFFFF" opacity="0.28"/>

      <g fill="#FFFFFF" opacity="0.32">
        <rect x="26" y="30" width="54" height="46" rx="6"/>
        <rect x="170" y="30" width="54" height="46" rx="6"/>
        <rect x="26" y="96" width="54" height="46" rx="6"/>
        <rect x="98" y="96" width="54" height="46" rx="6"/>
        <rect x="242" y="96" width="54" height="46" rx="6"/>
        <rect x="170" y="162" width="54" height="46" rx="6"/>
      </g>
      <g fill="#FFD479" opacity="0.95">
